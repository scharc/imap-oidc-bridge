name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: docker
    steps:
      - name: hello
        run: echo "hello from forgejo actions $(date)"

      - name: env probe
        run: |
          echo "GITHUB_ACTOR=$GITHUB_ACTOR"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          docker version | head -10
          which docker
          ls -la /var/run/docker.sock || true
          ls -la /
