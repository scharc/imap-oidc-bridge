name: build-imap-oidc-bridge

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'imap_oidc_bridge/**'
      - '.forgejo/workflows/build.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: docker
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: login to forgejo registry
        run: |
          echo "${{ secrets.REGISTRY_PUSH_TOKEN }}" | \
            docker login git.schuetze.io \
              --username marc \
              --password-stdin

      - name: build and push image
        run: |
          set -eux
          IMAGE=git.schuetze.io/cluster/imap-oidc-bridge
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          docker build \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${SHORT_SHA}" \
            .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:${SHORT_SHA}"
