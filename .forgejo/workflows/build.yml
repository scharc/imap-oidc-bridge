name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: docker
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: verify secret + login
        # Builds and pushes git.schuetze.io/cluster/imap-oidc-bridge.
        # Auth as marc using REGISTRY_PUSH_TOKEN (PAT scoped package: R+W);
        # marc is admin on cluster/, so it can push to cluster/* packages.
        # Avoid `echo $TOKEN | docker login --password-stdin` because Forgejo
        # Actions runs steps under `set -e -o pipefail`; if the secret is empty
        # the pipe SIGPIPEs and the step dies with exit 141 + zero log output,
        # which is hell to debug. Write the secret to a tempfile and use
        # --password-stdin < file instead.
        run: |
          SECRET_FILE=$(mktemp)
          chmod 600 "$SECRET_FILE"
          printf '%s' "${{ secrets.REGISTRY_PUSH_TOKEN }}" > "$SECRET_FILE"
          if [ ! -s "$SECRET_FILE" ]; then
            echo "REGISTRY_PUSH_TOKEN secret is empty — bail" >&2
            exit 2
          fi
          docker login git.schuetze.io --username marc --password-stdin < "$SECRET_FILE"
          rm -f "$SECRET_FILE"

      - name: build and push image
        run: |
          set -eux
          IMAGE=git.schuetze.io/cluster/imap-oidc-bridge
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          REF="${{ github.ref }}"

          docker build \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:sha-${SHORT_SHA}" \
            .
          docker push "${IMAGE}:latest"
          docker push "${IMAGE}:sha-${SHORT_SHA}"

          # If this run was triggered by a vX.Y.Z tag, also publish the semver
          if [[ "$REF" == refs/tags/v* ]]; then
            VERSION="${REF#refs/tags/v}"
            docker tag "${IMAGE}:sha-${SHORT_SHA}" "${IMAGE}:${VERSION}"
            docker push "${IMAGE}:${VERSION}"
          fi
