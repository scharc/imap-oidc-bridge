services:
  imap-oidc-bridge:
    # No prebuilt image is published yet — build from a checkout of this repo:
    #   docker compose build
    build:
      context: https://github.com/marc-schuetze/imap-oidc-bridge.git#main
    image: imap-oidc-bridge:local
    container_name: imap-oidc-bridge
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    networks:
      - traefik
    labels:
      traefik.enable: "true"
      traefik.http.routers.imap-oidc-bridge.rule: "Host(`imap-bridge.example.com`)"
      traefik.http.routers.imap-oidc-bridge.entrypoints: "websecure"
      traefik.http.routers.imap-oidc-bridge.tls.certresolver: "letsencrypt"
      traefik.http.services.imap-oidc-bridge.loadbalancer.server.port: "8000"

networks:
  traefik:
    external: true
