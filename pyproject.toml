[tool.poetry]
name = "imap-oidc-bridge"
version = "0.2.1"
description = "Tiny OIDC identity provider that authenticates against an IMAP server. Lets any OIDC consumer (Authentik, Keycloak, Dex, etc.) trust mailbox passwords as the source of truth."
authors = ["Marc Schuetze <agent-provocateur@zkm.de>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/scharc/imap-oidc-bridge"
keywords = ["oidc", "imap", "authentik", "sso", "identity-provider"]
packages = [{ include = "imap_oidc_bridge" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.136.0"
uvicorn = { extras = ["standard"], version = "^0.46.0" }
authlib = "^1.3"
cryptography = "^43.0"
pydantic = "^2.9"
pydantic-settings = "^2.6"
jinja2 = "^3.1"
python-multipart = "^0.0.27"
itsdangerous = "^2.2"
structlog = "^24.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.26.0"
httpx = "^0.28.0"
ruff = "^0.15.0"
mypy = "^1.13"
testcontainers = {version = ">=4.0", extras = ["core"]}

[tool.poetry.scripts]
imap-oidc-bridge = "imap_oidc_bridge.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require docker (run with `pytest -m integration`)",
    "e2e: end-to-end tests against a full Authentik stack (run with `pytest -m e2e`)",
]
addopts = "-m 'not integration and not e2e'"
